name: DB migration check

# Gates any PR that changes migrations or DB models: applies the full Alembic
# chain to a throwaway Postgres from scratch, then checks that the models have
# no un-migrated drift. Catches broken/missing migrations BEFORE they can reach
# production — never against the real Supabase DB.
on:
  pull_request:
    branches: [production, preview]
    paths:
      - "alembic/**"
      - "src/glitch_signal/db/**"
      - ".github/workflows/db-migrate-check.yml"

concurrency:
  group: db-migrate-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Local throwaway Postgres — no SSL, no pooler, so the resolver adds no
      # ssl/statement_cache args. Never the real Supabase DB.
      SIGNAL_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/signal
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install deps
        run: uv sync
      - name: Apply migrations from scratch (hard gate)
        run: uv run alembic upgrade head
      - name: Model-drift check (informational)
        # Surfaces SQLModel changes not captured in a migration. Kept
        # non-blocking because `alembic check` can be finicky with the async
        # env; the upgrade-from-scratch above is the real gate.
        continue-on-error: true
        run: uv run alembic check
