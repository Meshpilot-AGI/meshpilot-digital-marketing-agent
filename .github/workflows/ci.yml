name: CI
# CI (the Python check) gates ONLY the promotion to production, i.e. PRs whose
# base is `production` (in practice: preview -> production release PRs). Lane ->
# preview merges are intentionally ungated for fast iteration.
on:
  pull_request:
    branches: [production]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        run: uv sync
      - name: Import smoke test (deploy entrypoint loads)
        # Proves FastAPI Cloud can import the app. Config has all-default
        # settings, so no env is required just to import.
        run: uv run python -c "import main; assert main.app is not None; print('app import OK')"
      - name: Run tests
        run: uv run pytest -q
