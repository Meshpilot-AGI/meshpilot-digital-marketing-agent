name: CI
# Drift-aware checks that run as a PR GATE on pull requests into `production`.
# A `changes` job diffs the PR against its base and runs only what drifted:
#   - API code changed  -> import smoke + pytest
#   - DB changed         -> apply the full Alembic chain to a throwaway Postgres
#   - web/ changed       -> Next.js build (type-checks the frontend)
#   - gateway/ changed   -> docker build the gateway image + py_compile bridge.py
#   - only docs/logs     -> nothing runs, fast pass.
#
# ⚠️ THIS USED TO RUN ON PUSH TO `production`, which meant it validated code that had
# ALREADY merged and already begun deploying. A red run told you the trunk was broken;
# it could not stop it. Running the same checks on the PR makes them a gate instead of a
# report, and the cost is the same minutes spent a few seconds earlier.
#
# Merging still triggers the real deploys — FastAPI Cloud for the API, Railway for the
# gateway (watch paths `gateway/**`) — and those failing is the signal that something got
# through. Deploy is the second line, not the first.
#
# Kept on push as well, deliberately: a PR that was green against a stale base can still
# break the trunk once other PRs land ahead of it. The PR run is the gate; the push run is
# the truth about what is actually on `production`.
on:
  pull_request:
    branches: [production]
  push:
    branches: [production]
concurrency:
  # Per PR (or per push), so a new commit supersedes the run it replaced. Push runs on the
  # trunk are never cancelled — that run is the record of what production actually is.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: every job only reads the repo (checkout + tests + build).
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # need a base commit to diff against
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A PR diffs against its BASE, not against the previous commit: the interesting
          # question is "what does this change introduce to production", and on a branch with
          # several commits HEAD~1 answers a much narrower one.
          if [ -n "$BASE_SHA" ]; then
            base="$BASE_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          else
            base="$BEFORE"
          fi
          files=$(git diff --name-only "$base" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "changed files:"; echo "$files"
          api=false; web=false; db=false; gateway=false
          if echo "$files" | grep -qE '^(src/|main\.py$|pyproject\.toml$|uv\.lock$|tests/)'; then api=true; fi
          if echo "$files" | grep -qE '^(supabase/migrations/|src/glitch_signal/db/)'; then db=true; fi
          if echo "$files" | grep -qE '^web/'; then web=true; fi
          if echo "$files" | grep -qE '^gateway/'; then gateway=true; fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "gateway=$gateway" >> "$GITHUB_OUTPUT"
          echo "=> api=$api db=$db web=$web gateway=$gateway"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install deps
        run: uv sync --extra dev   # pytest/ruff live in the dev extra
      - name: Import smoke test (deploy entrypoint loads)
        run: uv run python -c "import main; assert main.app is not None; print('app import OK')"
      - name: Run tests
        run: uv run pytest -q

  db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17   # bundles pgvector (vector/halfvec) for agent_memory
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway local Postgres — validates the Supabase migrations, never the real DB.
      PGURL: postgresql://postgres:postgres@localhost:5432/signal
      # Mirror the prod `postgres` role's search_path so unqualified opclasses
      # (e.g. pgvector's `halfvec_cosine_ops`) still resolve after the extension
      # is relocated to `extensions` by the supa_harden migration. Without this,
      # the agent_memory HNSW-index migration fails its idempotency re-apply.
      PGOPTIONS: "-c search_path=public,extensions"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Apply Supabase migrations from scratch (hard gate)
        run: |
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            echo "== applying $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Idempotency check (re-apply must be a clean no-op)
        run: |
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"
          done

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build (type-checks the frontend)
        run: npm run build

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Syntax-check the bridge (docker build only runs it at container start)
        run: python3 -m py_compile gateway/bridge.py
      - name: Build the gateway image (exactly what Railway builds from gateway/Dockerfile)
        run: docker build -t meshpilot-gateway ./gateway
