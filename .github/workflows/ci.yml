name: CI
# Drift-aware checks that run ON PUSH to `production` (the single trunk) — not on
# feature branches or PRs. A `changes` job diffs the push and runs only what drifted:
#   - API code changed  -> import smoke + pytest
#   - DB changed         -> apply the full Alembic chain to a throwaway Postgres
#   - web/ changed       -> Next.js build (type-checks the frontend)
#   - only docs/logs     -> nothing runs, fast pass.
# (FastAPI Cloud also deploys on this push; run the full suite locally before merging.)
on:
  push:
    branches: [production]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: every job only reads the repo (checkout + tests + build).
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # need the pre-push commit to diff against
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          else
            base="$BEFORE"
          fi
          files=$(git diff --name-only "$base" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "changed files:"; echo "$files"
          api=false; web=false; db=false
          if echo "$files" | grep -qE '^(src/|main\.py$|pyproject\.toml$|uv\.lock$|tests/)'; then api=true; fi
          if echo "$files" | grep -qE '^(supabase/migrations/|src/glitch_signal/db/)'; then db=true; fi
          if echo "$files" | grep -qE '^web/'; then web=true; fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "=> api=$api db=$db web=$web"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install deps
        run: uv sync --extra dev   # pytest/ruff live in the dev extra
      - name: Import smoke test (deploy entrypoint loads)
        run: uv run python -c "import main; assert main.app is not None; print('app import OK')"
      - name: Run tests
        run: uv run pytest -q

  db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17   # bundles pgvector (vector/halfvec) for agent_memory
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway local Postgres — validates the Supabase migrations, never the real DB.
      PGURL: postgresql://postgres:postgres@localhost:5432/signal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Apply Supabase migrations from scratch (hard gate)
        run: |
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            echo "== applying $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Idempotency check (re-apply must be a clean no-op)
        run: |
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"
          done

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build (type-checks the frontend)
        run: npm run build
