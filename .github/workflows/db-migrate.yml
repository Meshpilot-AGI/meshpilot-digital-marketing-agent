name: DB migrate (production)

# Applies Alembic migrations to the production Supabase DB from CI — not a Mac.
# Triggers when migrations change and land on the production (deploy) branch,
# and on manual dispatch. `alembic upgrade head` is idempotent, so re-runs are
# safe no-ops.
#
# Ordering vs the app auto-deploy (both fire on a production push): ADDITIVE
# migrations (a new column/table the new code will use) are backward-compatible,
# so running them alongside the deploy is fine. For a REMOVAL, ship the code
# first, then run this (workflow_dispatch) after — never drop something the
# currently-running code still reads. See docs/vendors/supabase.md.
on:
  push:
    branches: [production]
    paths:
      - "alembic/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install deps
        run: uv sync
      - name: Apply migrations
        env:
          # The session-pooler DSN (us-east-2), a GitHub Actions secret. The
          # runner is IPv4, so it reaches the pooler (the direct host is IPv6-only).
          SIGNAL_DB_URL: ${{ secrets.SIGNAL_DB_URL }}
        run: uv run alembic upgrade head
