version: 2
updates:
  # GitHub Actions — keeps workflow action versions current (e.g. avoids the
  # Node 20 deprecation on checkout / setup-uv recurring).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Single trunk: updates open as PRs against production (drift-aware CI gates them).
    target-branch: "production"
    commit-message:
      prefix: "ci"

  # Python dependencies (uv — pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "production"
    commit-message:
      prefix: "deps"
